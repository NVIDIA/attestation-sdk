name: SDK smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      RUSTUP_TOOLCHAIN: stable
      NVAT_TEST_REQUIRE_SERVICE_KEY: "0"
      TEST_MODE: unit
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libxmlsec1-dev libxmlsec1-openssl zlib1g-dev python3-venv
          rustup toolchain install stable --profile minimal
          cargo install cbor-diag-cli --version 0.1.8 --locked

      # Use CMake directly so test.env is not loaded. Absent URL overrides use
      # the SDK's production service defaults.
      - name: Configure SDK and tests
        run: >-
          cmake -S nv-attestation-sdk-cpp -B build/sdk -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_SYSTEM_DEPS=ON
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=OFF

      - name: Build SDK and tests
        run: cmake --build build/sdk --target nv-attestation-unit-tests --parallel 2

      # Keep an explicit allowlist: other tests may depend on staging services.
      - name: Run selected SDK tests
        run: >-
          ctest --test-dir build/sdk --output-on-failure --no-tests=error --timeout 180
          -R '^(ErrorTest\.(ErrorEnumValuesAreUnique|EnumValuesHaveAToString)|UtilsTest\.(ToHexStringUppercase|GenerateValidNonceLengths)|ParseUriTest\.(HttpUrls|HttpsUrls)|GpuVerifierTest\.(SuccessfullyVerifyGpuEvidence|SuccessfullyVerifyGpuEvidenceRemoteVerifier)|LocalCorimVerifierTest\.(VerifyCmwBlackwellAnchorsAndVerifiesSignature|VerifyCmwRubinTocMatchesUnsignedFixtureRims)|CApiCorimVerifierTest\.(VerifyCmwBlackwellNoTocSucceeds|VerifyCmwRubinTocMatchesRewrittenRims))$'
